services:
  meteora-bot:
    image: ghcr.io/oplopuser/meteorabot:latest
    container_name: meteora-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8789:8789"
    volumes:
      - ./data:/app/data
      - ./wallet.json:/app/wallet.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
